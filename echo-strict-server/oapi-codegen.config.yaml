# yaml-language-server: $schema=https://raw.githubusercontent.com/oapi-codegen/oapi-codegen/HEAD/configuration-schema.json
package: spec
output: ./spec/spec.gen.go
generate:
  echo-server: true
  models: true
  strict-server: true
  embedded-spec: false
compatibility:
  old-enum-conflicts: true
output-options:
  skip-prune: true
  nullable-type: true
